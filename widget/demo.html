<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave AI Chatbot Widget — Демонстрационная страница</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0814;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(121, 40, 202, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.2) 0%, transparent 40%);
    }

    .container {
      max-width: 680px;
      padding: 40px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #c77dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #a0a0b8;
      line-height: 1.6;
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .code-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: left;
      font-family: monospace;
      font-size: 0.9rem;
      color: #c77dff;
      overflow-x: auto;
      margin-top: 16px;
    }

    .notice {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #ff0080;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">
      <span class="badge-dot"></span> Демонстрационный стенд виджета
    </div>
    <h1>AI Chatbot Widget</h1>
    <p>
      Обратите внимание на <strong>левый нижний угол экрана</strong> — там установлена плавающая неоновая кнопка вызова виджета поддержки.
    </p>

    <div class="code-box">
      &lt;script src="http://localhost:3005/chat-widget.js"&gt;&lt;/script&gt;
    </div>

    <div class="notice">
      ↙ Нажмите на кнопку в левом нижнем углу для открытия чата
    </div>
  </div>

  <!-- Подключение виджета (локальный путь для демо) -->
  <script src="chat-widget.js" data-api="http://localhost:3005/api/chat"></script>

</body>
</html>
