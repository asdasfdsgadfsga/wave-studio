<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#ff9e00" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#ff9e00" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <g transform="translate(250, 115)">
    <!-- Spring Steel Headband -->
    <path d="M-85,25 C-85,-90 85,-90 85,25" fill="none" stroke="#2b2536" stroke-width="14" stroke-linecap="round" />
    <path d="M-60,-55 C-30,-75 30,-75 60,-55" fill="none" stroke="#4a3e5c" stroke-width="18" stroke-linecap="round" />
    <!-- Metal Yokes -->
    <path d="M-85,20 L-85,45 L-65,65" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="round" />
    <path d="M85,20 L85,45 L65,65" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Open-back Ear Cup -->
    <circle cx="-65" cy="55" r="38" fill="url(#metalGrad)" stroke="#ff9e00" stroke-width="2" filter="url(#glow)" />
    <!-- Open Back Grille pattern -->
    <circle cx="-65" cy="55" r="24" fill="#0e0817" stroke="#ff9e00" stroke-width="1" stroke-dasharray="3 2" />
    <!-- Right Open-back Ear Cup -->
    <circle cx="65" cy="55" r="38" fill="url(#metalGrad)" stroke="#ff9e00" stroke-width="2" filter="url(#glow)" />
    <circle cx="65" cy="55" r="24" fill="#0e0817" stroke="#ff9e00" stroke-width="1" stroke-dasharray="3 2" />
    <!-- DT 1990 Badge -->
    <text x="0" y="60" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="9" font-weight="bold">PRO AUDIO 250Ω</text>
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">BEYERDYNAMIC DT 1990</text>
  <text x="460" y="247" text-anchor="end" fill="#ff9e00" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">TESLA 250 OHM REFERENCE</text>
</svg>