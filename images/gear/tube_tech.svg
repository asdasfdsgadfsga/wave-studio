<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#48cae4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#48cae4" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <g transform="translate(250, 115)">
    <!-- Classic Blue Chassis -->
    <rect x="-180" y="-42" width="360" height="84" rx="6" fill="#0a192f" stroke="#00b4d8" stroke-width="1.5" />
    <!-- Big Vintage Backlit VU Meter -->
    <rect x="-150" y="-30" width="100" height="60" rx="6" fill="#fff3b0" opacity="0.95" stroke="#333" stroke-width="2" filter="url(#glow)" />
    <path d="M-100,20 L-85,-15" stroke="#d90429" stroke-width="2.5" stroke-linecap="round" />
    <text x="-140" y="-12" fill="#222" font-family="monospace" font-size="8" font-weight="bold">VU METER</text>
    <text x="-140" y="5" fill="#333" font-family="monospace" font-size="7">GAIN REDUCTION</text>
    <!-- 4 Big Rotary Bakelite Knobs -->
    <circle cx="-15" cy="0" r="20" fill="#1b263b" stroke="#90e0ef" stroke-width="2" />
    <line x1="-15" y1="0" x2="-25" y2="-12" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <circle cx="45" cy="0" r="20" fill="#1b263b" stroke="#90e0ef" stroke-width="2" />
    <line x1="45" y1="0" x2="35" y2="-12" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <circle cx="105" cy="0" r="20" fill="#1b263b" stroke="#90e0ef" stroke-width="2" />
    <line x1="105" y1="0" x2="115" y2="-12" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <!-- Glowing Jewel Pilot Light -->
    <circle cx="150" cy="0" r="8" fill="#e63946" filter="url(#glow)" />
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">TUBE-TECH CL 1B</text>
  <text x="460" y="247" text-anchor="end" fill="#48cae4" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">OPTICAL TUBE COMPRESSOR</text>
</svg>