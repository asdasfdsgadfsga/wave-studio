<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#00f5d4" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <g transform="translate(250, 115)">
    <!-- 19 inch Rack Chassis -->
    <rect x="-180" y="-35" width="360" height="70" rx="6" fill="#120b1f" stroke="#00f5d4" stroke-width="1.5" filter="url(#glow)" />
    <!-- Rack screw holes -->
    <circle cx="-168" cy="0" r="5" fill="#05010a" stroke="#444" stroke-width="1.5" />
    <circle cx="168" cy="0" r="5" fill="#05010a" stroke="#444" stroke-width="1.5" />
    <!-- Black Screen Display Section -->
    <rect x="-140" y="-22" width="160" height="44" rx="4" fill="#05010a" stroke="rgba(255,255,255,0.1)" />
    <!-- VU Meter Bars on display -->
    <g transform="translate(-130, -12)">
      
        <rect x="0" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.4" />
        <rect x="0" y="9" width="10" height="15" rx="2" fill="#c77dff" />
      
        <rect x="18" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.6000000000000001" />
        <rect x="18" y="4" width="10" height="20" rx="2" fill="#c77dff" />
      
        <rect x="36" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.8" />
        <rect x="36" y="24" width="10" height="0" rx="2" fill="#c77dff" />
      
        <rect x="54" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="1" />
        <rect x="54" y="19" width="10" height="5" rx="2" fill="#c77dff" />
      
        <rect x="72" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.4" />
        <rect x="72" y="14" width="10" height="10" rx="2" fill="#c77dff" />
      
        <rect x="90" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.6000000000000001" />
        <rect x="90" y="9" width="10" height="15" rx="2" fill="#c77dff" />
      
        <rect x="108" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="0.8" />
        <rect x="108" y="4" width="10" height="20" rx="2" fill="#c77dff" />
      
        <rect x="126" y="0" width="10" height="24" rx="2" fill="#00f5d4" opacity="1" />
        <rect x="126" y="24" width="10" height="0" rx="2" fill="#c77dff" />
      
    </g>
    <!-- Big Volume Encoder Knob -->
    <circle cx="85" cy="0" r="24" fill="url(#metalGrad)" stroke="#00f5d4" stroke-width="2" />
    <circle cx="85" cy="0" r="28" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
    <!-- Monitor indicator dots -->
    <circle cx="135" cy="-8" r="4" fill="#00f5d4" filter="url(#glow)" />
    <circle cx="135" cy="8" r="4" fill="#c77dff" />
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">APOLLO X8 THUNDERBOLT</text>
  <text x="460" y="247" text-anchor="end" fill="#00f5d4" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">DSP 6-CORE AUDIO INTERFACE</text>
</svg>