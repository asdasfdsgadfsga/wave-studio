<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#f72585" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#f72585" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <g transform="translate(250, 115)">
    <rect x="-180" y="-38" width="360" height="76" rx="6" fill="#1b1d28" stroke="#f72585" stroke-width="1.5" filter="url(#glow)" />
    <!-- Classic SSL Trapezoid Meter -->
    <rect x="-145" y="-26" width="90" height="52" rx="4" fill="#0a0a0f" stroke="#fff" stroke-opacity="0.3" />
    <path d="M-100,18 L-80,-12" stroke="#f72585" stroke-width="2.5" stroke-linecap="round" />
    <text x="-135" y="-12" fill="#f72585" font-family="monospace" font-size="9" font-weight="bold">SSL BUS</text>
    <!-- Knobs: Threshold, Attack, Ratio, Release, Makeup -->
    
      <circle cx="-20" cy="0" r="16" fill="url(#metalGrad)" stroke="#f72585" stroke-width="1.5" />
      <line x1="-20" y1="0" x2="-14" y2="-10" stroke="#fff" stroke-width="2.5" />
    
      <circle cx="25" cy="0" r="16" fill="url(#metalGrad)" stroke="#f72585" stroke-width="1.5" />
      <line x1="25" y1="0" x2="31" y2="-10" stroke="#fff" stroke-width="2.5" />
    
      <circle cx="70" cy="0" r="16" fill="url(#metalGrad)" stroke="#f72585" stroke-width="1.5" />
      <line x1="70" y1="0" x2="76" y2="-10" stroke="#fff" stroke-width="2.5" />
    
      <circle cx="115" cy="0" r="16" fill="url(#metalGrad)" stroke="#f72585" stroke-width="1.5" />
      <line x1="115" y1="0" x2="121" y2="-10" stroke="#fff" stroke-width="2.5" />
    
      <circle cx="150" cy="0" r="16" fill="url(#metalGrad)" stroke="#f72585" stroke-width="1.5" />
      <line x1="150" y1="0" x2="156" y2="-10" stroke="#fff" stroke-width="2.5" />
    
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SSL G-MASTER BUS</text>
  <text x="460" y="247" text-anchor="end" fill="#f72585" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">LEGENDARY MIX GLUE</text>
</svg>