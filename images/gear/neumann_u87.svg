<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#c77dff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#c77dff" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <!-- Neumann Body -->
  <g transform="translate(250, 115)">
    <!-- Base stand -->
    <rect x="-10" y="65" width="20" height="25" fill="url(#metalGrad)" stroke="#666" stroke-width="1" />
    <rect x="-35" y="85" width="70" height="8" rx="3" fill="#181224" stroke="#c77dff" stroke-opacity="0.5" />
    <!-- Lower Body -->
    <rect x="-26" y="0" width="52" height="65" rx="5" fill="url(#metalGrad)" stroke="#888" stroke-width="1.5" />
    <!-- Neumann Diamond Badge -->
    <polygon points="0,22 10,32 0,42 -10,32" fill="#00f5d4" filter="url(#glow)" />
    <!-- Grill Body (Capsule Head) -->
    <path d="M-26,0 L-28,-65 Q-28,-85 0,-85 Q28,-85 28,-65 L26,0 Z" fill="#1a1429" stroke="#9d4edd" stroke-width="2" />
    <!-- Mesh pattern -->
    <line x1="-24" y1="-60" x2="24" y2="-60" stroke="#c77dff" stroke-opacity="0.5" stroke-width="1" />
    <line x1="-25" y1="-40" x2="25" y2="-40" stroke="#c77dff" stroke-opacity="0.5" stroke-width="1" />
    <line x1="-26" y1="-20" x2="26" y2="-20" stroke="#c77dff" stroke-opacity="0.5" stroke-width="1" />
    <line x1="0" y1="-80" x2="0" y2="0" stroke="#c77dff" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Dual Diaphragm Capsule visible inside -->
    <circle cx="0" cy="-45" r="17" fill="none" stroke="#ffb703" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="0" cy="-45" r="6" fill="#ffb703" opacity="0.8" />
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">NEUMANN U87 AI</text>
  <text x="460" y="247" text-anchor="end" fill="#c77dff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">STUDIO VOCAL GOLD</text>
</svg>