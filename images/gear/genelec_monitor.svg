<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#240c42" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090214" stop-opacity="1" />
      <stop offset="100%" stop-color="#040008" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4254" />
      <stop offset="50%" stop-color="#211c29" />
      <stop offset="100%" stop-color="#0f0c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="500" height="280" rx="14" fill="none" stroke="#70e000" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Studio Grid lines background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70" />
    <line x1="0" y1="140" x2="500" y2="140" />
    <line x1="0" y1="210" x2="500" y2="210" />
    <line x1="125" y1="0" x2="125" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="375" y1="0" x2="375" y2="280" />
  </g>

  <!-- Ambient Light Aura -->
  <circle cx="250" cy="120" r="80" fill="#70e000" opacity="0.16" filter="url(#softGlow)" />

  <!-- Equipment Illustration Art -->
  <g transform="translate(0, 5)">
    
  <g transform="translate(250, 115)">
    <!-- Curvy Aluminum Enclosure (MDE Minimum Diffraction) -->
    <rect x="-70" y="-80" width="140" height="160" rx="35" fill="url(#metalGrad)" stroke="#70e000" stroke-width="2" filter="url(#glow)" />
    <!-- Coaxial Mid/Tweeter Waveguide Center Cone -->
    <ellipse cx="0" cy="-20" rx="42" ry="36" fill="#100b1a" stroke="#444" stroke-width="1.5" />
    <!-- Tweeter Dome -->
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#70e000" stroke-width="2" />
    <circle cx="0" cy="-20" r="5" fill="#70e000" filter="url(#glow)" />
    <!-- Acoustically Concealed Woofer Slot (Bottom) -->
    <ellipse cx="0" cy="40" rx="38" ry="16" fill="#080312" stroke="#333" stroke-width="1.5" />
    <!-- Power LED Dot -->
    <circle cx="0" cy="65" r="3" fill="#70e000" filter="url(#glow)" />
  </g>

  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="25" y="222" width="450" height="42" rx="8" fill="#0c0418" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="40" y="248" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">GENELEC 8351B SAM</text>
  <text x="460" y="247" text-anchor="end" fill="#70e000" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">COAXIAL 3-WAY REFERENCE</text>
</svg>