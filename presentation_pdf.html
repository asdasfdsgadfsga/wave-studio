<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wave Studio Presentation PDF</title>
    <style>
        @page {
            size: 1920px 1080px;
            margin: 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #05010a;
        }
        .page {
            width: 1920px;
            height: 1080px;
            page-break-after: always;
            break-after: page;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .page:last-child {
            page-break-after: avoid;
            break-after: avoid;
        }
        .page img {
            width: 1920px;
            height: 1080px;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_01.png" alt="Slide 1"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_02.png" alt="Slide 2"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_03.png" alt="Slide 3"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_04.png" alt="Slide 4"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_05.png" alt="Slide 5"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_06.png" alt="Slide 6"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_07.png" alt="Slide 7"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_08.png" alt="Slide 8"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_09.png" alt="Slide 9"></div>
    <div class="page"><img src="presentation_screenshots/final_slides/slide_10.png" alt="Slide 10"></div>
</body>
</html>
